name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      # `uv sync` alone installs the dev group only. The unit tests also import the spark
      # (pyspark, pyarrow) and api (psycopg) groups, and sqlalchemy (pyiceberg's test catalog),
      # which today arrives only with the ml group. The runner's default JDK serves Spark.
      - name: Sync dependencies (project and every group)
        run: uv sync --all-groups

      - name: Gold files match CHECKSUMS
        run: make check-gold

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy on app/engine (allow-fail until M5)
        run: uv run mypy app/engine || true

      # The embedding tests run the real quantized bge ONNX from data/models (ADR-032): a one-time
      # download from Hugging Face as setup, like `uv sync`; the tests themselves open no sockets.
      - name: Fetch the embedding model
        run: make fetch-model

      - name: Unit and property tests (no live services)
        run: uv run pytest tests/unit tests/property -m "not live" -q
