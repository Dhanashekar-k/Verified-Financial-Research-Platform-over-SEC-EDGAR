# Local stack for edgar-verified-qa (M0). No MinIO, no Airflow (Airflow arrives in M10).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: edgarqa
      POSTGRES_PASSWORD: edgarqa
      POSTGRES_DB: edgarqa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgarqa -d edgarqa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    # all-in-one has no shell/curl inside, so no container healthcheck (shows "running",
    # not "healthy"). UI: http://localhost:16686
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

volumes:
  pgdata:
