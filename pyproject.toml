[project]
name = "edgar-verified-qa"
version = "0.0.0"
description = "Verified financial research platform over SEC EDGAR"
requires-python = ">=3.12,<3.13"

# Versions follow docs/plan/03_architecture_and_stack.md §2.
# Floors only; run `uv sync` to resolve the latest compatible patch (as §2 advises).
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "tenacity>=8.3",
  "rapidfuzz>=3.9",
  "duckdb>=1.1",
  "pyiceberg>=0.7",
  "sqlglot>=25.0",
  "pyyaml>=6.0",
  "tokenizers>=0.20",
  "fastembed>=0.4",
  "selectolax>=0.3",
  "lxml>=5.2",
  "beautifulsoup4>=4.12",
  "pymupdf>=1.24",
  "anthropic>=0.40",
  "numpy>=1.26",
  "pandas>=2.2",
]

[dependency-groups]
# PySpark pinned to 3.5.x to match the EMR Serverless release (§2, ADR-pin).
spark = ["pyspark>=3.5,<3.6"]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
  "opentelemetry-instrumentation-fastapi",
]
ml = [
  "scikit-learn>=1.5",
  "skl2onnx>=1.17",
  "onnxruntime>=1.19",
  "mlflow>=2.16",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "respx>=0.21",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[tool.uv]
# `uv sync` installs project deps + the `dev` group by default.
# Layer the rest explicitly, e.g. `uv sync --group spark --group api --group ml`.
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["warehouse", "data", "web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Interface-spec docstring tables in a stub Shekar will rewrite (edits to it are hook-blocked).
# Remove this line once the module is implemented.
"pipelines/spark/fiscal.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/engine"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
  "live: test may contact real external services (opt-in; excluded by default)",
]
addopts = "-ra"
# The project isn't installed as a package (no build-system), so put the repo root on sys.path.
pythonpath = ["."]
