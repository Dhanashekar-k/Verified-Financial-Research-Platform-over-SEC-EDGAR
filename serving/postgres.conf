# Postgres 17 + pgvector on the M3 serving box: m7i.large, 2 vCPU, 8 GiB (ADR-034).
# Starting points from M03 section 3.3 scaled to 8 GiB; they are [Guessing] until the bench measures them.
listen_addresses = '*'            # inside the container; the host maps 127.0.0.1:5432 only
max_connections = 50
shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 16MB
maintenance_work_mem = 1GB        # the loader raises it per session for the HNSW build
max_parallel_maintenance_workers = 2
random_page_cost = 1.1            # SSD (gp3)
jit = off                         # short lookups: JIT compilation costs more than it saves
# Bulk load: fewer, larger checkpoints and compressed WAL.
max_wal_size = 8GB
checkpoint_timeout = 15min
wal_compression = on
